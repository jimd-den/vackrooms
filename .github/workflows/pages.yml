name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@wasm-pack

      # The main engine (`/`) generates chunks in the browser, so it needs
      # nothing but static files. `wasm-pack` output is checked in for local
      # convenience, but Pages always deploys a fresh build from source.
      - name: Build wasm front end
        run: wasm-pack build wasm_frontend --target web --release --no-typescript --out-dir ../static/pkg

      # The whole app packed into one self-contained page, published as
      # /vackrooms.html next to the multi-file site (which stays the root).
      - name: Bundle single-file build
        run: |
          node scripts/build-single-file.mjs
          cp dist/vackrooms.html static/vackrooms.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

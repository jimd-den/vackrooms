<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vackrooms voxel debug</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#0b1015;color:#e7eef1;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}body{display:flex}aside{width:280px;padding:18px;background:#121a21;border-right:1px solid #2a3b46;overflow:auto}h1{font-size:15px;color:#63d9e8;margin:0 0 6px;letter-spacing:.08em}.note{color:#91a5af;font-size:11px;line-height:1.5}label{display:block;margin:12px 0 5px;color:#91a5af;font-size:10px;text-transform:uppercase}.row{display:flex;gap:6px}input,select,button{width:100%;padding:8px;background:#0b1116;border:1px solid #2a3b46;border-radius:4px;color:#fff;font:inherit}button{margin-top:16px;background:#63d9e8;color:#071014;font-weight:bold;cursor:pointer}.checks{border-top:1px solid #2a3b46;margin-top:20px;padding-top:8px}.checks label{text-transform:none;color:#d6e3e8;margin:9px 0}.checks input{width:auto}#stats{margin-top:20px;color:#91a5af;font-size:10px;line-height:1.7}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#0b1015dd;color:#63d9e8;z-index:2}main{position:relative;flex:1;min-width:0}canvas{display:block;width:100%;height:100%;cursor:grab}.drag{cursor:grabbing}.legend{position:absolute;right:16px;top:16px;padding:10px;background:#121a21dd;border:1px solid #2a3b46;color:#91a5af;line-height:1.8;font-size:10px;pointer-events:none}.selection{color:#d5e3e7;border-top:1px solid #2a3b46;margin-top:16px;padding-top:12px;font-size:10px;line-height:1.6}
</style></head><body><aside><h1>VOXEL DEBUG</h1><p class="note">Choose one question at a time: architecture, emitted materials, or validation.</p><label>Mode</label><select id="mode"><option value="layout">Layout · rooms and route</option><option value="materials">Materials · voxel cells</option><option value="validation">Validation · overlays and fixtures</option></select><label>Chunk X / Z (world units)</label><div class="row"><input id="cx" type="number" value="0" step="10"><input id="cz" type="number" value="0" step="10"></div><label>World seed</label><input id="seed" value="42"><label>Voxel scale</label><select id="scale"><option value="0.2">0.2m · 50 × 50</option><option value="0.1">0.1m · 200 × 200</option></select><div class="row"><button id="go">GENERATE</button><button id="more">+ BIGGER MAP</button></div><div class="checks"><label><input id="grid" type="checkbox"> voxel grid</label><label><input id="voxels" type="checkbox" checked> voxel materials</label><label><input id="semantics" type="checkbox" checked> room / corridor outlines</label><label><input id="labels" type="checkbox" checked> primary labels</label><label><input id="lights" type="checkbox"> fixture markers</label></div><div class="selection" id="selection">Click a room, portal, or corridor for details.</div><div id="stats">Loading WASM…</div></aside><main><canvas id="map"></canvas><div class="legend"><b style="color:#fff">#</b> wall &nbsp; <b style="color:#ef5669">R</b> red light<br><b style="color:#f4d37c">L</b> light &nbsp; <b style="color:#74848b">_</b> floor<br><span style="color:#5cdef0">cyan</span> main · <span style="color:#b68af5">purple</span> secondary</div><div class="loading" id="loading">Loading WASM…</div></main>
<script type="module">
import init,{get_debug_chunk_json}from'./pkg/wasm_frontend.js';const c=document.querySelector('#map'),x=c.getContext('2d'),$=id=>document.querySelector('#'+id),load=$('loading'),stats=$('stats'),selection=$('selection');let chunks=[],radius=0,selected=null,view={wx:0,wz:0,s:10},drag=null;
function hash(v){let n=Number.parseInt(v,10);if(Number.isFinite(n))return n>>>0;let h=2166136261;for(const q of v){h^=q.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function tx(w){return c.clientWidth/2+(w-view.wx)*view.s}function ty(w){return c.clientHeight/2+(w-view.wz)*view.s}function fit(){let d=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);if(chunks.length){let span=(radius*2+1)*chunks[0].width*chunks[0].scale;view.s=Math.min(c.clientWidth,c.clientHeight)/span*.82}draw()}
function draw(){x.clearRect(0,0,c.clientWidth,c.clientHeight);x.fillStyle='#0b1015';x.fillRect(0,0,c.clientWidth,c.clientHeight);let cellPx=chunks[0]?.scale*view.s||0;for(const d of chunks){let ox=tx(d.origin[0]),oy=ty(d.origin[1]);if($('grid').checked&&cellPx>=8){x.save();x.globalAlpha=cellPx<16?.18:.48;x.strokeStyle='#78909a';x.lineWidth=1;for(let i=0;i<=d.width;i++){x.beginPath();x.moveTo(ox+i*d.scale*view.s,oy);x.lineTo(ox+i*d.scale*view.s,oy+d.depth*d.scale*view.s);x.stroke()}for(let i=0;i<=d.depth;i++){x.beginPath();x.moveTo(ox,oy+i*d.scale*view.s);x.lineTo(ox+d.width*d.scale*view.s,oy+i*d.scale*view.s);x.stroke()}x.restore()}
if($('voxels').checked){let colors={'#':'#090b0c',R:'#d53d53',L:'#f2cb70',X:'#6e2935','_':'#263b40','^':'#33424a','.':'#111a1f'};for(let z=0;z<d.depth;z++)for(let q=0;q<d.width;q++){x.fillStyle=colors[d.cells[z*d.width+q]]||colors['.'];x.fillRect(ox+q*d.scale*view.s+.5,oy+z*d.scale*view.s+.5,Math.max(1,cellPx-1),Math.max(1,cellPx-1))}}
if($('semantics').checked){let corridorSeen=false;for(const b of d.boxes){let color={assembly:'#dbe6e8',space:'#718087',ceiling:'#e1b34c',structure:'#697983',portal:'#7fe49b'}[b[0]]||'#fff',bx=tx(d.origin[0]+b[2]*d.scale),by=ty(d.origin[1]+b[3]*d.scale),bw=b[4]*d.scale*view.s,bh=b[5]*d.scale*view.s,isSelected=selected&&selected.d===d&&selected.b===b;x.save();x.strokeStyle=color;x.lineWidth=isSelected?2.5:b[0]==='assembly'?1.5:1;x.setLineDash(b[0]==='space'||b[0]==='ceiling'||b[0]==='structure'?[5,3]:[]);if(isSelected){x.fillStyle=color+'25';x.fillRect(bx,by,bw,bh)}x.strokeRect(bx,by,bw,bh);x.restore();if($('labels').checked&&b[0]==='assembly'){x.fillStyle=color;x.font='10px monospace';x.textAlign='center';x.fillText(b[1],bx+bw/2,by+bh/2);x.textAlign='left'}if($('labels').checked&&b[0]==='portal'&&isSelected){x.fillStyle=color;x.fillText(`${b[1]} · ${Math.round(b[4]*d.scale*10)/10}m`,bx,by-4)}}for(const q of d.corridors){let color=q[5]===0?'#5cdef0':'#b68af5';x.save();x.strokeStyle=color;x.lineWidth=q[5]===0?3:1.5;x.beginPath();x.moveTo(tx(d.origin[0]+q[0]*d.scale),ty(d.origin[1]+q[1]*d.scale));x.lineTo(tx(d.origin[0]+q[2]*d.scale),ty(d.origin[1]+q[3]*d.scale));x.stroke();x.restore();if($('labels').checked&&!corridorSeen&&q[5]===0){x.fillStyle=color;x.font='10px monospace';x.fillText('MAIN CORRIDOR',tx(d.origin[0]+q[0]*d.scale)+4,ty(d.origin[1]+q[1]*d.scale)-5);corridorSeen=true}}}
if($('lights').checked)for(const l of d.fixtures){x.fillStyle=l[4]?'#71ecf4':'#4c5c61';x.fillRect(tx(d.origin[0]+(l[0]-l[2])*d.scale),ty(d.origin[1]+(l[1]-l[3])*d.scale),Math.max(2,l[2]*2*d.scale*view.s),Math.max(2,l[3]*2*d.scale*view.s))}x.strokeStyle='#89959a';x.setLineDash([6,4]);x.strokeRect(ox,oy,d.width*d.scale*view.s,d.depth*d.scale*view.s);x.setLineDash([])}}
function applyMode(){let mode=$('mode').value;['grid','voxels','semantics','labels','lights'].forEach(id=>$(id).checked=mode==='materials'?id==='grid'||id==='voxels':mode==='validation'?id!=='labels':id==='voxels'||id==='semantics'||id==='labels');draw()}async function generate(){load.style.display='grid';let t=performance.now(),seed=hash($('seed').value.trim()),cx=+$('cx').value||0,cz=+$('cz').value||0,scale=+$('scale').value,step=scale<=.1?20:10;chunks=[];for(let z=-radius;z<=radius;z++)for(let q=-radius;q<=radius;q++)chunks.push(JSON.parse(get_debug_chunk_json(seed,cx+q*step,cz+z*step,scale)));view.wx=cx+(radius?0:chunks[0].width*scale/2);view.wz=cz+(radius?0:chunks[0].depth*scale/2);selected=null;selection.textContent='Click a room, portal, or corridor for details.';fit();stats.textContent=`${chunks.length} chunks · ${chunks.reduce((n,d)=>n+d.cells.length,0)} cells · ${(performance.now()-t).toFixed(1)} ms`;load.style.display='none';draw()}
function pick(e){let hit=null,wx=view.wx+(e.offsetX-c.clientWidth/2)/view.s,wz=view.wz+(e.offsetY-c.clientHeight/2)/view.s;for(const d of chunks){for(const b of d.boxes){let bx=d.origin[0]+b[2]*d.scale,by=d.origin[1]+b[3]*d.scale,bw=b[4]*d.scale,bh=b[5]*d.scale;if(wx>=bx&&wx<=bx+bw&&wz>=by&&wz<=by+bh)hit={d,b}}}if(hit){selected=hit;selection.textContent=`${hit.b[1]} · ${hit.b[0]} · ${hit.b[4].toFixed(1)}×${hit.b[5].toFixed(1)} voxels`}else{selected=null;selection.textContent='No semantic object at that point.'}draw()}
$('mode').onchange=applyMode;$('go').onclick=()=>{radius=0;generate()};$('more').onclick=()=>{radius=Math.min(3,radius+1);generate()};['grid','voxels','semantics','labels','lights'].forEach(id=>$(id).onchange=draw);onresize=fit;c.onclick=pick;c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,wx:view.wx,wz:view.wz};c.classList.add('drag')};c.onpointermove=e=>{if(drag){view.wx=drag.wx-(e.clientX-drag.x)/view.s;view.wz=drag.wz-(e.clientY-drag.y)/view.s;draw()}};c.onpointerup=()=>{drag=null;c.classList.remove('drag')};c.onwheel=e=>{e.preventDefault();view.s=Math.max(.5,Math.min(40,view.s*(e.deltaY<0?1.15:.87)));draw()};await init();generate();
</script></main></body></html>
